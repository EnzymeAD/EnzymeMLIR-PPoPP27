name: RSBench Benchmarks

on:
  workflow_dispatch:
    inputs:
      rsbench_lookups:
        description: "RSBench C++ lookups"
        required: false
        default: "10200"
      rsbench_reps:
        description: "RSBench repetitions"
        required: false
        default: "5"
      docker_tag:
        description: "Docker image tag on ghcr.io/enzymead/enzymemlir-ppopp27"
        required: false
        default: "latest"
  push:
    branches: ["main"]
    paths:
      - "rsbench/**"
      - "futhark-nightly-linux-x86_64/**"
      - ".github/workflows/rsbench.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "rsbench/**"
      - "futhark-nightly-linux-x86_64/**"
      - ".github/workflows/rsbench.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rsbench-benchmarks:
    name: RSBench Benchmark (C++ & Futhark on A100 GPU)
    runs-on: linux-x86-a2-48-a100-4gpu
    timeout-minutes: 90
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:${{ inputs.docker_tag || 'latest' }}
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System and GPU Information
        run: |
          nvidia-smi
          /home/evaluator/llvm-project/build/bin/clang++ --version || true
          ./futhark-nightly-linux-x86_64/bin/futhark --version || true

      - name: Run RSBench Benchmarks (EnzymeMLIR, EnzymeLLVM, Futhark)
        env:
          EVAL_HOME: /home/evaluator
          RSBENCH_LOOKUPS: ${{ inputs.rsbench_lookups || '10200' }}
          RSBENCH_REPS: ${{ inputs.rsbench_reps || '5' }}
        run: |
          bash rsbench/run_benchmarks.sh

      - name: Upload RSBench Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsbench-benchmark-results
          path: |
            rsbench/cpp/timings/
            rsbench/futhark/timings/
            results/rsbench_results_latest.json
