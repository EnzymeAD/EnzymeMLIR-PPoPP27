name: LBM Benchmarks

on:
  workflow_dispatch:
    inputs:
      lbm_steps:
        description: "LBM simulation steps"
        required: false
        default: "100"
      lbm_reps:
        description: "LBM repetitions"
        required: false
        default: "5"
      docker_tag:
        description: "Docker image tag on ghcr.io/enzymead/enzymemlir-ppopp27"
        required: false
        default: "latest"
  push:
    branches: ["main"]
    paths:
      - "lbm/**"
      - "futhark-nightly-linux-x86_64/**"
      - ".github/workflows/lbm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "lbm/**"
      - "futhark-nightly-linux-x86_64/**"
      - ".github/workflows/lbm.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lbm-benchmarks:
    name: LBM Benchmark (C++ & Futhark on A100 GPU)
    runs-on: linux-x86-a2-48-a100-4gpu
    timeout-minutes: 90
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:${{ inputs.docker_tag || 'latest' }}
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System and GPU Information
        run: |
          nvidia-smi
          /home/evaluator/llvm-project/build/bin/clang++ --version || true
          ./futhark-nightly-linux-x86_64/bin/futhark --version || true

      - name: Run LBM Benchmarks (EnzymeMLIR, EnzymeLLVM, Futhark)
        env:
          EVAL_HOME: /home/evaluator
          LBM_STEPS: ${{ inputs.lbm_steps || '100' }}
          LBM_REPS: ${{ inputs.lbm_reps || '5' }}
        run: |
          bash lbm/run_benchmarks.sh

      - name: Upload LBM Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lbm-benchmark-results
          path: |
            lbm/cpp/timings/
            lbm/futhark/timings/
            results/lbm_results_latest.json
