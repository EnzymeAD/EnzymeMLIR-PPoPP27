name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["*"]
    paths: &docker_paths
      - "docker/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main"]
    paths: *docker_paths

concurrency:
  # Cancel in-progress jobs on PRs and branches when newer commits are pushed.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker image
    runs-on: docker
    timeout-minutes: 720
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # zstd layers decompress several times faster than gzip; image extraction on the
          # K8s GPU runners is the bottleneck behind the 10-minute pod-readiness timeout.
          outputs: type=image,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          # No GitHub Actions cache: the image (~11 GB compressed) exceeds the 10 GB GHA cache
          # cap, and exporting it hung the self-hosted runner for 30+ minutes after each push.
          # The persistent docker1 runner keeps BuildKit's local layer cache between builds.
