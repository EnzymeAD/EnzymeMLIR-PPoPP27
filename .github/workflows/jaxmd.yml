name: JAX-MD Benchmarks

on:
  workflow_dispatch:
    inputs:
      jaxmd_warmup:
        description: "JAX-MD warmup runs per configuration"
        required: false
        default: "2"
      jaxmd_repeat:
        description: "JAX-MD measured repetitions per configuration"
        required: false
        default: "12"
      docker_tag:
        description: "Docker image tag on ghcr.io/enzymead/enzymemlir-ppopp27"
        required: false
        default: "latest"
  push:
    branches: ["main"]
    paths:
      - "jax/jaxmd/**"
      - ".github/workflows/jaxmd.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "jax/jaxmd/**"
      - ".github/workflows/jaxmd.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jaxmd-benchmarks:
    name: JAX-MD Benchmark (A100 GPU)
    runs-on: linux-x86-a2-48-a100-4gpu
    timeout-minutes: 60
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:${{ inputs.docker_tag || 'latest' }}
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System and GPU Information
        run: |
          nvidia-smi
          /home/evaluator/eval-env/bin/python3 -c "import jax; print('JAX version:', jax.__version__, 'Devices:', jax.devices())" || python3 -c "import jax; print('JAX version:', jax.__version__, 'Devices:', jax.devices())"

      - name: Run JAX-MD Benchmark
        env:
          JAXMD_WARMUP: ${{ inputs.jaxmd_warmup || '2' }}
          JAXMD_REPEAT: ${{ inputs.jaxmd_repeat || '12' }}
        run: |
          bash jax/jaxmd/run_benchmarks.sh

      - name: Upload JAX-MD Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaxmd-benchmark-results
          path: |
            results/jaxmd/results_JAXMD.json
