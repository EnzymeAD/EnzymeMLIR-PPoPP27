name: Oceananigans Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Oceananigans/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Oceananigans/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    name: Oceananigans Test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:latest
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Information
        run: |
          julia -e 'using InteractiveUtils; versioninfo()'

      - name: Link Manifest
        run: |
          if [ -f /opt/julia_project/Manifest.toml ]; then
            ln -sf /opt/julia_project/Manifest.toml Oceananigans/Manifest.toml
          fi

      - name: Oceananigans forward consistency check (CPU)
        run: |
          cd Oceananigans
          REACTANT_BACKEND=cpu julia --project=/opt/julia_project bench/forward_consistency.jl 1 --reactant-init

      - name: Oceananigans Enzyme driver smoke run (CPU)
        run: |
          cd Oceananigans
          julia --project=/opt/julia_project bench/driver_enzyme.jl --config enzyme_naive --nsteps 4 --repeats 2

      - name: Oceananigans Reactant driver smoke run (CPU)
        run: |
          cd Oceananigans
          REACTANT_BACKEND=cpu julia --project=/opt/julia_project bench/driver_reactant.jl --config reactant_full --nsteps 4 --repeats 2
