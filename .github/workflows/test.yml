name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    name: Oceananigans Test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:latest
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System Information
        run: |
          julia -e 'using InteractiveUtils; versioninfo()'

      - name: Oceananigans forward consistency check (CPU)
        run: |
          cd Oceananigans
          REACTANT_BACKEND=cpu julia --project=. bench/forward_consistency.jl 1 --reactant-init

      - name: Oceananigans Enzyme driver smoke run (CPU)
        run: |
          cd Oceananigans
          julia --project=. bench/driver_enzyme.jl --config enzyme_naive --nsteps 4 --repeats 2

  test-gpu:
    name: Oceananigans Test (GPU)
    runs-on: linux-x86-a2-48-a100-4gpu
    timeout-minutes: 60
    container:
      image: ghcr.io/enzymead/enzymemlir-ppopp27:latest
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: System and GPU Information
        run: |
          nvidia-smi
          julia -e 'using InteractiveUtils; versioninfo()'
          julia -e 'using CUDA; @show CUDA.functional(); if CUDA.functional() @show CUDA.devices() end'

      - name: Oceananigans forward consistency check (GPU)
        run: |
          cd Oceananigans
          REACTANT_BACKEND=gpu julia --project=. bench/forward_consistency.jl 1 --reactant-init

      - name: Oceananigans Reactant driver smoke run (GPU)
        run: |
          cd Oceananigans
          REACTANT_BACKEND=gpu julia --project=. bench/driver_reactant.jl --config reactant_full --nsteps 4 --repeats 2
